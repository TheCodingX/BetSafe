<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Ingresar — BetSafe</title>
<meta name="description" content="Ingresá a tu cuenta BetSafe. Demo: admin/admin (Standard) o vip/vip (VIP)." />
<meta name="theme-color" content="#ffffff" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="assets/img/icon-192.svg" type="image/svg+xml" />
<link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>

<div data-shell-header></div>

<main id="main" class="container section" style="display:grid;place-items:center;min-height:calc(100dvh - 200px)">
  <div class="card card-pad-lg" style="width:min(440px, 96vw)" id="authBox">
    <div class="stack-lg">
      <div class="stack-sm text-center">
        <h1 class="h2">Ingresá a BetSafe</h1>
        <p class="muted">Para apostadores serios. +18 · Argentina legal.</p>
      </div>

      <div class="seg" role="tablist" aria-label="Modo">
        <button class="active" role="tab" aria-selected="true" data-mode="login">Login</button>
        <button role="tab" aria-selected="false" data-mode="signup">Crear cuenta</button>
      </div>

      <form id="formLogin" class="stack" autocomplete="on" novalidate>
        <div class="field">
          <label class="field-label" for="user">Usuario</label>
          <div class="input-group">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
            </span>
            <input id="user" name="user" class="input" placeholder="admin" autocomplete="username" required />
          </div>
        </div>
        <div class="field">
          <label class="field-label" for="pass">Contraseña</label>
          <div class="input-group">
            <span class="icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            </span>
            <input id="pass" name="pass" type="password" class="input" placeholder="••••••" autocomplete="current-password" required />
          </div>
        </div>
        <label class="check"><input type="checkbox" checked /><span class="box"></span><span>Mantener sesión</span></label>
        <button class="btn btn-primary btn-lg btn-block mag" type="submit">Ingresar</button>
        <div class="card card-tinted" style="font-size:.85rem">
          <strong>Cuentas demo</strong>
          <div class="row between mt-2">
            <span><span class="kbd">admin</span> / <span class="kbd">admin</span></span>
            <button type="button" class="btn btn-outline btn-sm" data-fill="admin">Usar</button>
          </div>
          <div class="row between mt-2">
            <span><span class="kbd">vip</span> / <span class="kbd">vip</span></span>
            <button type="button" class="btn btn-gold btn-sm" data-fill="vip">Usar VIP</button>
          </div>
        </div>
        <div id="loginErr" class="text-danger tiny" role="alert"></div>
      </form>

      <form id="formSignup" class="stack" hidden novalidate>
        <div class="grid grid-2">
          <div class="field">
            <label class="field-label">Nombre</label>
            <input class="input" name="name" placeholder="Tu nombre" />
          </div>
          <div class="field">
            <label class="field-label">Edad</label>
            <input class="input" name="age" type="number" min="18" max="100" placeholder="18" required />
          </div>
        </div>
        <div class="field">
          <label class="field-label">Email</label>
          <input class="input" name="email" type="email" placeholder="vos@correo.com" required />
        </div>
        <div class="field">
          <label class="field-label">Usuario</label>
          <input class="input" name="user" placeholder="nombre.usuario" required />
        </div>
        <div class="field">
          <label class="field-label">Contraseña</label>
          <input class="input" type="password" name="pass" placeholder="Mínimo 8 caracteres" required minlength="8" />
        </div>
        <label class="check"><input type="checkbox" required /><span class="box"></span><span class="tiny muted">Acepto los <a href="terminos.html" class="text-brand">términos</a>, <a href="privacidad.html" class="text-brand">privacidad</a> y soy mayor de 18 años.</span></label>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Crear cuenta</button>
        <p class="tiny muted text-center">Backend en Supabase próximamente — la demo guarda local.</p>
      </form>
    </div>
  </div>
</main>

<div data-shell-footer></div>

<script src="assets/js/env.js"></script>
<script src="assets/js/live.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/logos.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/supabase-client.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/math.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  // If already logged in
  if (BSAuth.isAuthed()) location.href = 'dashboard.html';

  const seg = document.querySelectorAll('.seg button');
  seg.forEach(b => b.addEventListener('click', () => {
    seg.forEach(x => { x.classList.remove('active'); x.setAttribute('aria-selected', 'false'); });
    b.classList.add('active'); b.setAttribute('aria-selected', 'true');
    const mode = b.dataset.mode;
    document.getElementById('formLogin').hidden = mode !== 'login';
    document.getElementById('formSignup').hidden = mode !== 'signup';
  }));

  document.querySelectorAll('[data-fill]').forEach(b => b.addEventListener('click', () => {
    const u = b.dataset.fill; document.getElementById('user').value = u; document.getElementById('pass').value = u;
    document.getElementById('formLogin').requestSubmit();
  }));

  document.getElementById('formLogin').addEventListener('submit', async e => {
    e.preventDefault();
    const u = document.getElementById('user').value.trim();
    const p = document.getElementById('pass').value;
    document.getElementById('loginErr').textContent = '';
    const r = await BSAuth.login(u, p);
    if (r.ok) {
      BSUI.toast({ title: '¡Bienvenido!', message: 'Sesión iniciada.', type: 'success' });
      if (r.session.tier === 'vip') BSUI.confetti(80);
      setTimeout(() => location.href = 'dashboard.html', 600);
    } else {
      document.getElementById('loginErr').textContent = r.error;
    }
  });

  document.getElementById('formSignup').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const age = Number(fd.get('age'));
    const email = String(fd.get('email') || '').trim();
    const password = String(fd.get('password') || '');
    const name = String(fd.get('name') || '').trim();
    if (age < 18) { BSUI.toast({ title: 'Debés ser mayor de 18', type: 'danger' }); return; }
    // Si hay Supabase configurado, intentamos signup real. Si no, demo local.
    if (BSAuth.isSupabaseEnabled && BSAuth.isSupabaseEnabled()) {
      const r = await BSAuth.signUp({ email, password, name });
      if (!r.ok) { BSUI.toast({ title: 'No se pudo crear', message: r.error, type: 'danger' }); return; }
      BSUI.toast({ title: 'Cuenta creada', message: 'Bienvenido.', type: 'success' });
    } else {
      await BSAuth.login('admin', 'admin');
      BSUI.toast({ title: 'Cuenta creada (demo)', message: 'Te logueamos como Standard. Configurá Supabase para sign-up real.', type: 'success' });
    }
    setTimeout(() => location.href = 'dashboard.html', 600);
  });
});
</script>
</body>
</html>
