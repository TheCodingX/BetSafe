<!-- Premium initial loader inline para que aparezca antes de cualquier JS.
     Se oculta automáticamente cuando BSLive snapshot está listo + logos cargaron. -->
<style id="bs-preloader-styles">
  html.bs-preloading body { overflow: hidden; }
  #bs-preloader {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, #112147 0%, #0a1530 55%, #050a1e 100%);
    z-index: 99999;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px;
    transition: opacity .55s cubic-bezier(.4,0,.2,1);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', system-ui, sans-serif;
    color: rgba(255,255,255,0.92);
  }
  #bs-preloader.is-hidden { opacity: 0; pointer-events: none; }
  .bs-preloader__mark {
    width: 84px; height: 84px;
    position: relative;
    animation: bs-mark-pulse 2.4s ease-in-out infinite;
  }
  .bs-preloader__mark svg { width: 100%; height: 100%; display: block; }
  @keyframes bs-mark-pulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 4px 22px rgba(196,154,26,.32)); }
    50% { transform: scale(1.05); filter: drop-shadow(0 6px 32px rgba(196,154,26,.52)); }
  }
  .bs-preloader__brand {
    font-size: 1.35rem; font-weight: 800; letter-spacing: -.02em;
    display: flex; gap: 2px;
  }
  .bs-preloader__brand .bet { color: #ffffff; }
  .bs-preloader__brand .safe { color: #ffd76b; }
  .bs-preloader__bar {
    width: 220px; height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px; overflow: hidden;
    position: relative;
  }
  .bs-preloader__bar::after {
    content: '';
    position: absolute; left: -40%; top: 0; bottom: 0; width: 40%;
    background: linear-gradient(90deg, transparent, rgba(255,215,107,0.85), transparent);
    animation: bs-bar-sweep 1.4s cubic-bezier(.4,0,.2,1) infinite;
  }
  @keyframes bs-bar-sweep {
    0% { left: -40%; }
    100% { left: 100%; }
  }
  .bs-preloader__hint {
    font-size: .78rem; color: rgba(255,255,255,0.55);
    letter-spacing: .03em; text-transform: uppercase;
    transition: opacity .3s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .bs-preloader__mark { animation: none; }
    .bs-preloader__bar::after { animation: none; left: 0; width: 100%; opacity: .3; }
  }
</style>
<script>
  document.documentElement.classList.add('bs-preloading');
  (function () {
    var maxWaitMs = 5500;  // hard cap: nunca esperamos más de 5.5s
    var minShowMs = 600;    // mostramos al menos 600ms para que no parpadee
    var startedAt = Date.now();
    function hide() {
      var loader = document.getElementById('bs-preloader');
      if (!loader) return;
      var elapsed = Date.now() - startedAt;
      var wait = Math.max(0, minShowMs - elapsed);
      setTimeout(function () {
        loader.classList.add('is-hidden');
        document.documentElement.classList.remove('bs-preloading');
        setTimeout(function () { loader && loader.parentNode && loader.parentNode.removeChild(loader); }, 600);
      }, wait);
    }
    // Hard cap: si algo se cuelga, igual sacamos el loader
    setTimeout(hide, maxWaitMs);
    // Cuando el snapshot del backend está listo, ocultamos
    window.addEventListener('bs:live-ready', hide, { once: true });
    // Fallback: DOMContentLoaded + 800ms (logos suelen cargar en ese rango)
    if (document.readyState === 'complete') {
      setTimeout(hide, 800);
    } else {
      window.addEventListener('load', function () { setTimeout(hide, 400); }, { once: true });
    }
  })();
</script>
