# BetSafe — Render.com deployment (backend scraper + frontend en un solo service)
# ============================================================================
# El backend Node.js de /server sirve:
#   - Frontend estático (HTML/CSS/JS) en la raíz `/`
#   - API REST en /api/*
#   - WebSocket push en /api/live
#   - Scrapeo cada SCRAPE_INTERVAL_MS de las 12 casas argentinas legales
#
# Cómo deployar:
#   1) Pushear este repo a GitHub
#   2) render.com → New + → Blueprint → conectar el repo
#   3) Render lee este YAML y crea el Web Service
#   4) Settings → Environment → cargar env vars de .env.example
#   5) Deploy
#
# Plan Render recomendado: Standard ($25/mes) — el plan Free hibernará el
# scraper cada 15min de inactividad y perderemos snapshots.
# ============================================================================

services:
  - type: web
    name: betsafe
    runtime: node
    plan: standard
    region: oregon
    branch: main
    rootDir: server
    buildCommand: 'npm install && npx playwright install chromium --with-deps && node ../build/inject-env.js'
    startCommand: npm start
    healthCheckPath: /api/health
    pullRequestPreviewsEnabled: true
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: PORT
        value: '8787'
      - key: SCRAPE_INTERVAL_MS
        value: '30000'
      - key: ARB_INTERVAL_MS
        value: '5000'
      - key: ENABLED_BOOKS
        value: 'bplay,betano,betwarrior,bet365ar,codere,caliente,casinomagic,betsson,jugabet,24bet,playcity,megapuesta'
      - key: CORS_ORIGIN
        value: '*'
      # Factors APIs (opcionales — sin keys los factores quedan "unavailable")
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      # IA (cascada client-side) — se inyectan al frontend via build/inject-env.js
      - key: BS_GROQ_API_KEY
        sync: false
      - key: BS_GEMINI_API_KEY
        sync: false
      - key: BS_OPENROUTER_API_KEY
        sync: false
      - key: BS_FOOTBALL_DATA_API_KEY
        sync: false
      - key: BS_SUPABASE_URL
        sync: false
      - key: BS_SUPABASE_ANON_KEY
        sync: false
