[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Permitir XHR + WebSocket al backend Render. Si vivís en Netlify y el
    # backend está en Render, agregá su dominio acá (ej.
    # https://betsafe.onrender.com y wss://betsafe.onrender.com).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https: wss: https://api.groq.com https://generativelanguage.googleapis.com https://openrouter.ai;"

[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/app"
  to = "/dashboard.html"
  status = 200

[[redirects]]
  from = "/app/*"
  to = "/dashboard.html"
  status = 200
