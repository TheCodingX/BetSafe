# BetSafe — Render.com deployment (backend scraper + frontend en un solo service)
# ============================================================================
# El backend Node.js de /server sirve:
#   - Frontend estático (HTML/CSS/JS) en la raíz `/`
#   - API REST en /api/*
#   - WebSocket push en /api/live
#   - Scrapeo cada SCRAPE_INTERVAL_MS de las 6 casas argentinas legales
#     (Bplay, Betano, BetWarrior, Bet365 AR, Codere, Betsson)
#
# Cómo deployar:
#   1) Pushear este repo a GitHub
#   2) render.com → New + → Blueprint → conectar el repo
#   3) Render lee este YAML y crea el Web Service
#   4) Settings → Environment → cargar env vars de .env.example
#   5) Deploy
#
# Plan Render recomendado: Standard ($25/mes) — el plan Free hibernará el
# scraper cada 15min de inactividad y perderemos snapshots.
# ============================================================================

services:
  - type: web
    name: betsafe
    runtime: node
    plan: standard
    region: oregon
    branch: main
    rootDir: server
    # IMPORTANTE: NO usar `--with-deps` en Render — intenta `sudo apt-get` y
    # Render no permite root durante el build (su: Authentication failure).
    # El runtime de Render Node viene con la mayoría de las libs C que Chromium
    # headless necesita. Si Chromium falla al arrancar por una lib específica
    # faltante, conviene migrar a un Dockerfile con FROM mcr.microsoft.com/playwright.
    #
    # PLAYWRIGHT_BROWSERS_PATH fuerza que Chromium se instale dentro del
    # project workspace (persiste entre build y runtime). Sin esto, el default
    # `/opt/render/.cache/ms-playwright` se borra al pasar a runtime y
    # browserType.launch() falla con "Executable doesn't exist".
    buildCommand: 'PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.cache/ms-playwright npm install && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.cache/ms-playwright npx playwright install chromium && node ../build/inject-env.js'
    startCommand: npm start
    healthCheckPath: /api/health
    pullRequestPreviewsEnabled: true
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: PORT
        value: '8787'
      # Playwright debe encontrar Chromium en RUNTIME en el mismo path que el
      # build install. /opt/render/project/src/ persiste entre fases.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: '/opt/render/project/src/.cache/ms-playwright'
      - key: SCRAPE_INTERVAL_MS
        value: '30000'
      - key: ARB_INTERVAL_MS
        value: '5000'
      - key: ENABLED_BOOKS
        value: 'bplay,betano,betwarrior,bet365ar,codere,betsson'
      - key: PICKS_CONCURRENCY
        value: '5'
      - key: ODDS_API_SPORTS_PER_CYCLE
        value: '6'
      - key: CORS_ORIGIN
        value: '*'
      # The Odds API — fuente PRIMARIA. Sin esto el sistema depende de scrapers.
      - key: THE_ODDS_API_KEY
        sync: false
      - key: ODDSAPI_REGION
        value: 'eu'
      # Factors APIs (opcionales — sin keys los factores quedan "unavailable")
      - key: OPENWEATHER_API_KEY
        sync: false
      # API-Football: elegí UNA (directa o via RapidAPI). Si no cargás ninguna,
      # las lesiones caen a ESPN scrape (best effort).
      - key: APISPORTS_KEY
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      # IA (cascada client-side) — se inyectan al frontend via build/inject-env.js
      - key: BS_GROQ_API_KEY
        sync: false
      - key: BS_GEMINI_API_KEY
        sync: false
      - key: BS_OPENROUTER_API_KEY
        sync: false
      - key: BS_FOOTBALL_DATA_API_KEY
        sync: false
      - key: BS_SUPABASE_URL
        sync: false
      - key: BS_SUPABASE_ANON_KEY
        sync: false
